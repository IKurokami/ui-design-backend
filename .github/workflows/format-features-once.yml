name: Format feature files (temporary)
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  gofmt:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/library-search-favorites-auth-20261010' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Apply gofmt
        run: |
          gofmt -w internal/domain/story.go internal/repository/db.go internal/repository/story_repo.go internal/repository/favorites_repo.go internal/service/story_service.go internal/transport/http/story_handler.go internal/transport/http/favorites_handler.go internal/transport/http/router.go tests/catalog_favorites_test.go
          git add internal/domain/story.go internal/repository/db.go internal/repository/story_repo.go internal/repository/favorites_repo.go internal/service/story_service.go internal/transport/http/story_handler.go internal/transport/http/favorites_handler.go internal/transport/http/router.go tests/catalog_favorites_test.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: format library search and favorites'
            git push origin HEAD:feat/library-search-favorites-auth-20261010
          fi
