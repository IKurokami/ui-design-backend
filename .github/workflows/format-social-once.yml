name: Format social feature files (temporary)
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  gofmt:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/reader-author-ecosystem-20261010' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format feature sources
        run: |
          gofmt -w internal/domain/social.go internal/domain/story.go internal/repository/db.go internal/repository/social_repo.go internal/repository/story_repo.go internal/service/story_service.go internal/transport/http/social_handler.go internal/transport/http/router.go tests/social_flow_test.go tests/story_flow_test.go
          git add internal/domain/social.go internal/domain/story.go internal/repository/db.go internal/repository/social_repo.go internal/repository/story_repo.go internal/service/story_service.go internal/transport/http/social_handler.go internal/transport/http/router.go tests/social_flow_test.go tests/story_flow_test.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: gofmt social features'
            git push origin HEAD:feat/reader-author-ecosystem-20261010
          fi
