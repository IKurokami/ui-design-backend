name: Format new social test (temporary)
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/reader-author-ecosystem-20261010' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format Go social test
        run: |
          gofmt -w tests/social_moderation_test.go
          git add tests/social_moderation_test.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: format social moderation test'
            git push origin HEAD:feat/reader-author-ecosystem-20261010
          fi
